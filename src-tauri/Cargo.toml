[workspace]
members = [".", "core", "platform", "server"]

[package]
name = "notetaker"
version = "0.1.2"
description = "A fully local notetaker for Mac and PC"
authors = ["George Brothers"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notetaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the webview load a recording's audio off disk.
# Without it `convertFileSrc` produces a URL the player cannot open, and the
# transcript's click-to-play does nothing on the desktop while working fine in
# the served UI — a difference that would be baffling to debug.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
notetaker-core = { path = "core" }
