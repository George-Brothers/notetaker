[package]
name = "notetaker-core"
version = "0.1.0"
description = "Notetaker core logic: storage, index, pipeline, queue (no Tauri/UI deps)"
authors = ["George Brothers"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "notetaker_core"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
flacenc = "0.5.1"
hound = "3.5.1"
log = "0.4.33"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sherpa-rs = "0.6.8"
symphonia = { version = "0.6.0", features = ["flac"] }
sysinfo = "0.39.6"
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1.24.0", features = ["v4"] }
whisper-rs = "0.16.0"

notetaker-platform = { path = "../platform" }
# Unpacking the speaker-segmentation model, which sherpa-onnx ships as a
# `.tar.bz2`. `tar` without `xattr`, and `bzip2` on its default pure-Rust
# backend rather than the optional `bzip2-sys` C one. This crate already drags
# three C/C++ builds behind it (SQLite, whisper.cpp, sherpa-onnx), each of
# which is a way the Windows and macOS builds can break for reasons that have
# nothing to do with our code; a fourth, for the sake of decompressing one
# file, is not worth it.
tar = { version = "0.4.46", default-features = false }
bzip2 = "0.6.1"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"

# The real microphone, on the two platforms we ship. Deliberately NOT enabled
# on Linux: `alsa-sys` needs pkg-config we have no sudo to install in the WSL2
# build environment, and the capture logic is tested there against
# `capture::source::FakeSource` instead. Linux is a build host here, not a
# target — see docs/MAP.md.
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.16.0"

# Metal, on macOS only.
#
# This is not an optimization — it is what `Tier::AppleSiliconBig` already
# promises. `models::detect_tier` puts any Apple Silicon machine with >= 16 GB
# on the large model, and the comment there justifies it with "the large model
# on the GPU". Without this feature `whisper-rs` builds with `default = []`,
# there is no GPU path at all, and that tier quietly means "the large model on
# the CPU" — the worst of both choices. A 4-minute recording already costs over
# ten minutes on CPU (see docs/MAP.md, "Next"), so the tier would be selecting
# for a machine that cannot honour it.
#
# Declared here rather than in `[dependencies]` because cargo unions features
# across target sections: the base `whisper-rs` line stays featureless for
# Windows and Linux, and only a macOS build pulls the Metal path in.
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.16.0"
