<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- A page with a recording dot on it: notes first, recorder second, which
       is the same claim the app makes. Inline geometry only — an icon that
       fetched anything would break the "nothing leaves this machine" promise
       on the one file every page load requests. -->
  <rect width="32" height="32" rx="7" fill="#2f6f4e" />
  <path
    d="M10 9.5h9.5a2 2 0 0 1 2 2V22a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V11.5a2 2 0 0 1 2-2Z"
    fill="#faf8f3"
  />
  <path
    d="M11.5 13.5h8M11.5 16.5h8M11.5 19.5h5"
    stroke="#2f6f4e"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.45"
  />
  <circle cx="22" cy="10.5" r="4.5" fill="#cc3b33" stroke="#faf8f3" stroke-width="1.6" />
</svg>
