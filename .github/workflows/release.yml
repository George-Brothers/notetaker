name: Release desktop app

# A release is deliberate: merging a PR does not publish it. Pushing a v* tag
# builds the Windows installer, signs its update metadata, and makes it the
# GitHub Release that installed copies query from Settings.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release-version:
    name: Verify the release tag and app version agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest takes its version from the tag while Tauri takes the
      # installed app's version from tauri.conf.json. If they differ, a
      # successful-looking release can make installed copies repeatedly offer
      # the same update forever. Refuse to publish that split-brain release.
      - name: Match the tag to the desktop version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          tag = os.environ["RELEASE_TAG"]
          with open("src-tauri/tauri.conf.json") as f:
              version = json.load(f)["version"]
          expected = f"v{version}"
          if tag != expected:
              sys.exit(f"release tag {tag!r} does not match app version {version!r}; expected {expected!r}")
          print(f"release tag and app version agree: {tag}")
          EOF

  windows-release:
    name: Signed Windows release
    needs: verify-release-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-release
          prefix-key: v2-notetaker-release
          cache-directories: |
            ~/AppData/Local/sherpa-rs

      - name: Install LLVM for bindgen
        run: choco install llvm --no-progress -y
      - name: Point bindgen at libclang
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # The sherpa build script copies native runtime libraries; refreshing its
      # crate avoids a stale cache producing a package without them.
      - name: Restore sherpa runtime libraries
        shell: bash
        working-directory: src-tauri
        run: |
          cargo clean -p sherpa-rs-sys || true
          cargo clean -p sherpa-rs-sys --release || true

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # App-local MSVC libraries make a fresh Windows installation work too.
      # Tauri validates bundle resources at compile time, so copy them before
      # compiling the app.
      - name: Put the MSVC runtime beside the app
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "vswhere found no Visual Studio installation" }
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt").Trim()
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\$version\x64\Microsoft.VC*.CRT" -Directory | Select-Object -First 1
          if (-not $crt) { throw "no x64 MSVC runtime found" }
          New-Item -ItemType Directory -Force -Path 'src-tauri/target/release' | Out-Null
          Copy-Item "$($crt.FullName)\*.dll" 'src-tauri/target/release' -Force

      - name: Compile release dependencies
        working-directory: src-tauri
        run: |
          cargo build --release -p notetaker-core
          cargo build --release -p notetaker

      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build

      - name: Check the updater signature exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer was produced" }
          if (-not (Test-Path "$($installer.FullName).sig")) { throw "no updater signature found for $($installer.Name)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  macos-release:
    name: Signed macOS release
    needs: verify-release-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-release
          prefix-key: v2-notetaker-release
          cache-directories: |
            ~/Library/Caches/sherpa-rs

      - name: Restore sherpa runtime libraries
        working-directory: src-tauri
        run: |
          cargo clean -p sherpa-rs-sys || true
          cargo clean -p sherpa-rs-sys --release || true

      # The same certificate every local build signs with. TCC on macOS ties
      # the Screen Recording grant to `certificate leaf`, so an update signed
      # with any OTHER identity would silently orphan the user's permission —
      # the exact bug this certificate exists to end. CI must therefore sign
      # with the identical cert, imported from secrets into a throwaway
      # keychain. The runner has passwordless sudo, so the self-signed cert
      # can be trusted at the system level (headless — no GUI prompt exists).
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:" -s -k ci build.keychain
          openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nokeys -clcerts -out cert.pem
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain cert.pem
          rm -f cert.p12 cert.pem
          security find-identity -v -p codesigning build.keychain

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Deterministic order: sherpa's build script must copy its dylibs before
      # the app crate's compile-time resource check looks for them.
      - name: Compile release dependencies
        working-directory: src-tauri
        run: cargo build --release -p notetaker-core

      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build

      - name: Check the bundle signature and updater artifact
        run: |
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Notetaker.app
          codesign -dvv src-tauri/target/release/bundle/macos/Notetaker.app 2>&1 | grep "Authority=Notetaker Local Signing"
          test -f src-tauri/target/release/bundle/macos/Notetaker.app.tar.gz
          test -f src-tauri/target/release/bundle/macos/Notetaker.app.tar.gz.sig

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            src-tauri/target/release/bundle/macos/Notetaker.app.tar.gz
            src-tauri/target/release/bundle/macos/Notetaker.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish the release and its update manifest
    needs: [windows-release, macos-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One latest.json for every platform, assembled from the signatures the
      # build jobs produced. The installed apps poll this file; a platform
      # missing from it simply never sees an update.
      - name: Write the signed update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, glob, datetime

          tag = os.environ["RELEASE_TAG"]
          base = f"https://github.com/George-Brothers/notetaker-releases/releases/download/{tag}"

          def entry(pattern):
              [artifact] = glob.glob(pattern)
              with open(artifact + ".sig") as f:
                  sig = f.read().strip()
              return {"signature": sig, "url": f"{base}/{os.path.basename(artifact)}"}

          manifest = {
              "version": tag.lstrip("v"),
              "notes": "See the release notes on GitHub.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "windows-x86_64": entry("artifacts/windows-release/*.exe"),
                  "darwin-aarch64": entry("artifacts/macos-release/macos/*.app.tar.gz"),
              },
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      # Published to the PUBLIC releases repo, not this one: the source repo is
      # private, and assets on a private repo 404 for the installed apps'
      # updater (no way to ship auth inside the binary without leaking it).
      # RELEASES_TOKEN is a token with write access to notetaker-releases.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: George-Brothers/notetaker-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            artifacts/windows-release/*.exe
            artifacts/windows-release/*.sig
            artifacts/macos-release/macos/*.app.tar.gz
            artifacts/macos-release/macos/*.app.tar.gz.sig
            artifacts/macos-release/dmg/*.dmg
            latest.json
