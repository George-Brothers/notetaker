name: CI

# The only machine that can tell the truth about the platform code.
#
# Everything in this repo is developed on Linux, where the Tauri app crate does
# not build at all and neither macOS nor Windows capture code is ever compiled.
# `scripts/check-platforms.sh` type-checks the platform crate against both real
# targets from Linux, which catches most mistakes in seconds — but it cannot
# link, cannot run a test, and cannot compile `notetaker-core` for a foreign
# target at all (its bundled SQLite, whisper.cpp and sherpa-onnx need the
# target's C++ toolchain; verified — it fails looking for MSVC's `lib.exe`).
#
# So this matrix is the first and only place where:
#   * `capture::platform`'s Windows and macOS arms are compiled at all,
#   * `power::probe`'s WinProbe / MacProbe are compiled at all,
#   * the Tauri app crate is compiled at all,
#   * any test runs on a real Windows or macOS machine.
#
# Worth knowing: anarlog, whose capture code parts of this adapt, runs CI on
# ubuntu-latest only. Their Windows code has never been compiled by its authors
# either. This is the first thing to try it.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A CI failure should say what broke, not just that something did.
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # The fast gate. Everything that can be checked without a Mac or a PC, run
  # first so an obvious mistake does not wait on the slow native jobs.
  # -------------------------------------------------------------------------
  linux:
    name: Linux — core, frontend, cross-target checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      # `sherpa-rs` does not build its native libraries. Its build script
      # downloads a prebuilt `libonnxruntime` / `libsherpa-onnx-c-api` into a
      # per-user cache directory outside `target/`, then copies the shared
      # objects loose into `target/debug/` and `target/debug/deps/` — where
      # cargo puts them on the loader path when it runs a test.
      #
      # Those copies are not cargo-tracked artifacts, so the cache save step
      # sweeps them, and a restored cache is missing them while cargo still
      # considers the build script fresh and never re-runs it. A commit that
      # changed nothing but documentation therefore turned the whole matrix red
      # — first at link time, then (once the download directory was cached too)
      # at load time, with `error while loading shared libraries`.
      #
      # So: cache the downloads, *and* force that one build script to re-run so
      # it re-copies. Reproduced locally by deleting the same files by hand —
      # same `exit code 127` — and the clean is what repairs it.
      #
      # `prefix-key` is bumped to discard the caches saved in the broken state.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v2-sherpa
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs

      - name: Install libclang (bindgen, for whisper-rs)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Restore sherpa's shared libraries (see comment above)
        shell: bash
        working-directory: src-tauri
        run: cargo clean -p sherpa-rs-sys || true

      - name: Core tests
        working-directory: src-tauri
        run: cargo test -p notetaker-core

      - name: Platform tests (the pure layer — convert, resample, ring)
        working-directory: src-tauri
        run: cargo test -p notetaker-platform

      # The served web UI, including its end-to-end tests over real sockets.
      # Fully verifiable on Linux — it needs no microphone, no models and no
      # OS-specific API — so it is a real gate here, not a compile check.
      - name: Server tests (routing, auth, traversal, end-to-end HTTP)
        working-directory: src-tauri
        run: cargo test -p notetaker-server

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -p notetaker-core -p notetaker-platform -p notetaker-server --all-targets -- -D warnings

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check -p notetaker-core -p notetaker-platform -p notetaker-server

      # The same check a developer runs locally, so a drift between the two is
      # visible here rather than discovered on someone's machine.
      - name: Cross-target type-check (Windows + macOS platform layer)
        run: ./scripts/check-platforms.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      # `pnpm build` is the only typecheck in this project — vitest does not
      # typecheck, so a contract change can pass every test and still be broken.
      - name: Frontend typecheck + build
        run: pnpm build

  # -------------------------------------------------------------------------
  # The jobs that actually matter for this plan. Each compiles and runs the
  # platform code on its own operating system.
  # -------------------------------------------------------------------------
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the other platform because one failed — when both are
      # broken, seeing both failures in one run is the whole point.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows — capture, power probe, app crate
          - os: macos-14
            name: macOS — capture, power probe, app crate
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
          prefix-key: v2-sherpa
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs

      # whisper-rs runs bindgen, which needs libclang. macOS runners ship it
      # with Xcode; Windows runners need LLVM installed and pointed at.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --no-progress -y

      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Restore sherpa's shared libraries (see the Linux job's comment)
        shell: bash
        working-directory: src-tauri
        run: cargo clean -p sherpa-rs-sys || true

      # This is the step that exists for this plan. On Linux these targets are
      # never compiled: capture::platform's per-OS arms, WinProbe / MacProbe,
      # the cpal microphone, and on Windows the WASAPI loopback source.
      - name: Build core + platform for this OS
        working-directory: src-tauri
        run: cargo build -p notetaker-core -p notetaker-platform -p notetaker-server --all-targets

      - name: Test core + platform on this OS
        working-directory: src-tauri
        run: cargo test -p notetaker-core -p notetaker-platform -p notetaker-server

      - name: Clippy on this OS
        working-directory: src-tauri
        run: cargo clippy -p notetaker-core -p notetaker-platform -p notetaker-server --all-targets -- -D warnings

      # The frontend has to be built before the Tauri app crate, which embeds
      # dist/ at compile time via tauri::generate_context!.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The Tauri shell never compiles on Linux (libdbus-sys needs pkg-config
      # unavailable in the dev environment), so this is its only check.
      - name: Build the Tauri app crate
        working-directory: src-tauri
        run: cargo build -p notetaker

  # -------------------------------------------------------------------------
  # The installer. Separate from `native` because it is a full release build of
  # the whole C/C++ stack and should not slow down the test gate, and because a
  # packaging failure is a different kind of news from a test failure.
  #
  # This exists so that getting a Windows build onto a Windows machine costs a
  # download rather than an afternoon of installing MSVC. The artifact is a real
  # NSIS installer; it is unsigned, so Windows SmartScreen will warn on first
  # run ("More info" -> "Run anyway").
  # -------------------------------------------------------------------------
  package-windows:
    name: Windows — the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Its own cache key: this is the only job that builds `--release`, and
      # sharing a key with the debug job would have each evict the other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-release
          prefix-key: v2-sherpa
          cache-directories: |
            ~/AppData/Local/sherpa-rs

      - name: Install LLVM (bindgen, for whisper-rs)
        run: choco install llvm --no-progress -y

      - name: Point bindgen at libclang
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # See the Linux job's comment: the cache sweeps the shared libraries
      # sherpa's build script copies, and this is what makes it copy them again.
      # Both profiles, because this job needs the release ones.
      - name: Restore sherpa's shared libraries (see the Linux job's comment)
        shell: bash
        working-directory: src-tauri
        run: |
          cargo clean -p sherpa-rs-sys || true
          cargo clean -p sherpa-rs-sys --release || true

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` embeds dist/ at compile time, so the frontend
      # has to exist before the app crate is compiled.
      - run: pnpm build

      # Compiled as its own step rather than left to `tauri build`, so that the
      # listing below happens *between* the compile and the bundle. If the
      # bundler then cannot find a DLL, the run already shows what was there.
      - name: Compile the app in release
        working-directory: src-tauri
        run: cargo build --release -p notetaker

      - name: What sherpa left in the build folder
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/*.dll | Select-Object Name, Length

      - name: Build the installer
        run: pnpm tauri build

      # The whole point of the job. `bundle.resources` in
      # tauri.windows.conf.json is supposed to put every third-party runtime
      # library next to Notetaker.exe; this opens the installer that was just
      # built and checks that they are in there. Without it the app installs
      # cleanly and then refuses to start, which is the failure this job was
      # created to prevent — so it is checked on the artifact, not assumed from
      # the config.
      - name: Prove the installer carries the libraries the app needs
        shell: pwsh
        run: |
          $expected = Get-ChildItem src-tauri/target/release/*.dll |
            Where-Object { $_.Name -notlike 'notetaker*' } |
            ForEach-Object { $_.Name }
          if (-not $expected) { throw "no runtime DLLs in target/release — nothing to check against" }

          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer was produced" }
          Write-Host "installer: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"

          $listing = & 'C:\Program Files\7-Zip\7z.exe' l $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not read the installer (exit $LASTEXITCODE)" }
          $listing | Write-Host

          $missing = $expected | Where-Object { -not ($listing -match [regex]::Escape($_)) }
          if ($missing) {
            throw "the installer does not contain: $($missing -join ', ') — the installed app would not start"
          }
          Write-Host "all $($expected.Count) runtime libraries are inside the installer"

      - uses: actions/upload-artifact@v4
        with:
          name: notetaker-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # What CI still cannot tell us. Printed rather than left implicit, because a
  # green run is easy to read as "it works".
  # -------------------------------------------------------------------------
  caveats:
    name: What a green run does not prove
    runs-on: ubuntu-latest
    needs: [linux, native, package-windows]
    if: always()
    steps:
      - run: |
          cat <<'NOTE'
          A green CI run proves the code compiles and its tests pass on all
          three operating systems. It does NOT prove:

            * that a microphone or system-audio stream produces real audio —
              CI runners have no audio devices, so every capture test runs
              against fakes;
            * that macOS Screen Recording permission is requested, granted or
              refused correctly — that only happens in front of a real user;
            * that transcription quality is what the bake-off measured — no
              model is downloaded here;
            * that the Windows installer installs. It is built, and its
              contents are checked, but nothing runs it. The installer is
              also unsigned, so SmartScreen will warn on first launch;
            * anything at all about how the UI looks.

          Those need a human at a real machine. See the "verified vs assumed"
          section of docs/MAP.md.
          NOTE
